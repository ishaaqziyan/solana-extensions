name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

env:
  SOLANA_VERSION: 3.1.10
  ANCHOR_VERSION: 1.1.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libudev-dev

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.89.0 --profile minimal -c rustfmt,clippy
          rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        env:
          # rust-toolchain.toml at repo root pins 1.89.0 for any cargo run from
          # here, overriding `rustup default` — avm's own deps need newer rustc,
          # so force stable explicitly for this step (covers avm's internal
          # cargo invocations too, not just the top-level `cargo install`).
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install "$ANCHOR_VERSION"
          avm use "$ANCHOR_VERSION"

      - name: Build program
        run: anchor build

      - name: Run program tests (litesvm)
        run: cargo test --manifest-path programs/transfer-hook/Cargo.toml

      - name: Run indexer tests
        run: cargo test --manifest-path indexer/Cargo.toml
